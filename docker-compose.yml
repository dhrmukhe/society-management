services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: society
      POSTGRES_USER: society
      POSTGRES_PASSWORD: society123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U society -d society"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://society:society123@db:5432/society
      JWT_SECRET: change-this-secret-in-production
      ADMIN_EMAIL: admin@pleasantpalace.local
      ADMIN_PASSWORD: admin123
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
